name: Update Satellite GP Snapshots

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and validate Starlink & Active GP JSON snapshots
        run: |
          mkdir -p public/data

          download_and_validate() {
            local url="$1"
            local out_path="$2"
            local tmp_file
            tmp_file="$(mktemp)"

            echo "Fetching $url -> $out_path ..."
            if ! curl -fsSL -A "Mozilla/5.0" "$url" -o "$tmp_file"; then
              rm -f "$tmp_file"
              return 1
            fi
            if ! head -c 1 "$tmp_file" | grep -q '^\['; then
              rm -f "$tmp_file"
              return 1
            fi
            if ! node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!Array.isArray(data) || data.length === 0 || !data[0].OBJECT_NAME) {
                process.exit(1);
              }
              console.log(`Validated ${data.length} GP records for ${process.argv[2]}.`);
            ' "$tmp_file" "$out_path"; then
              rm -f "$tmp_file"
              return 1
            fi

            mv "$tmp_file" "$out_path"
            return 0
          }

          if ! (download_and_validate "https://celestrak.org/NORAD/elements/supplemental/sup-gp.php?FILE=starlink&FORMAT=json" "public/data/starlink.json" || \
                download_and_validate "https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=json" "public/data/starlink.json"); then
            echo "::warning::Skipping starlink.json update (download or validation failed)."
          fi

          if ! download_and_validate "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json" "public/data/active.json"; then
            echo "::warning::Skipping active.json update (download or validation failed)."
          fi

      - name: Commit and push updated snapshots
        run: |
          if git diff --quiet -- public/data/starlink.json public/data/active.json && \
             [ -z "$(git status --porcelain -- public/data/starlink.json public/data/active.json)" ]; then
            echo "No changes to GP snapshots; skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/starlink.json public/data/active.json
          git commit -m "chore(data): update Starlink & Active GP snapshots ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push origin HEAD:main
